[package]
name = "discord-learn-programming-bot"
version = "0.1.0"
edition = "2024"
description = "A guild-scoped Discord bot that teaches programming with reviewed AI responses"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
dotenvy = "0.15"
emojis = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12", default-features = false, features = [
    "builder",
    "client",
    "gateway",
    "http",
    "model",
    # Serenity 0.12 uses an unpatched rustls 0.22 through its WebSocket backend.
    # Use the supported native TLS backend; keep reqwest's Rustls feature patched too.
    "native_tls_backend",
] }
sqlx = { version = "0.8", default-features = false, features = [
    "macros",
    "migrate",
    # SQLite does not need a TLS backend.
    "runtime-tokio",
    "sqlite",
] }
thiserror = "2"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "registry",
] }

[dev-dependencies]
pretty_assertions = "1"
