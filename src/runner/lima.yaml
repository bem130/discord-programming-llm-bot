minimumLimaVersion: 2.0.0

# Do not inherit the default host-home mount. The guest has no host filesystem access.
base:
  - template:_images/ubuntu

# Keep the backend deterministic across hosts. In particular, WSL2 cannot consume the
# regular Ubuntu disk image inherited above and remains experimental in Lima.
vmType: qemu

cpus: 2
memory: 2GiB
disk: 20GiB
plain: true
mounts: []
portForwards: []

user:
  passwordlessSudo: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends \
        build-essential \
        ca-certificates \
        cargo \
        curl \
        git \
        pkg-config \
        python3 \
        python3-pip \
        python3-venv \
        rustc
      apt-get clean
      rm -rf /var/lib/apt/lists/*
